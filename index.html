        passwordInput.setAttribute('aria-labelledby', 'auth-password-label');
        passwordLabel.id = 'auth-password-label';

        const signInBtn = document.createElement('button');
        signInBtn.className = 'auth-btn email-btn';
        signInBtn.textContent = 'Sign In';
        signInBtn.onclick = async () => {
          const email = emailInput.value;
          const password = passwordInput.value;
          const errorEl = document.getElementById('auth-error');
          try {
            await FirebaseSync.signInWithEmail(email, password);
          } catch(e) {
            errorEl.textContent = e.message;
            errorEl.style.display = 'block';
          }
        };

        const signUpBtn = document.createElement('button');
        signUpBtn.className = 'auth-btn email-btn';
        signUpBtn.textContent = 'Sign Up';
        signUpBtn.onclick = async () => {
          const email = emailInput.value;
          const password = passwordInput.value;
          const errorEl = document.getElementById('auth-error');
          if (password.length < 6) {
            errorEl.textContent = 'Password must be at least 6 characters';
            errorEl.style.display = 'block';
            return;
          }
          try {
            await FirebaseSync.signUpWithEmail(email, password);
          } catch(e) {
            errorEl.textContent = e.message;
            errorEl.style.display = 'block';
          }
        };

        const divider = document.createElement('div');
        divider.textContent = '— or —';
        divider.style.textAlign = 'center';
        divider.style.color = 'var(--text-secondary)';
        divider.style.fontSize = '0.85rem';

        const googleBtn = document.createElement('button');
        googleBtn.className = 'auth-btn google-btn';
        googleBtn.innerHTML = 'Sign in with Google';
        googleBtn.onclick = async () => {
          const errorEl = document.getElementById('auth-error');
          try {
            await FirebaseSync.signInWithGoogle();
          } catch(e) {
            errorEl.textContent = e.message;
            errorEl.style.display = 'block';
          }
        };

        const errorEl = document.createElement('div');
        errorEl.id = 'auth-error';
        errorEl.setAttribute('role', 'alert');
        errorEl.className = 'auth-error';
        errorEl.setAttribute('aria-live', 'polite');
        errorEl.style.display = 'none';

        form.appendChild(emailInput);
        form.appendChild(passwordLabel);
        form.appendChild(passwordInput);
        form.appendChild(signInBtn);
        form.appendChild(signUpBtn);
        form.appendChild(divider);
        form.appendChild(googleBtn);
        form.appendChild(errorEl);

        const skipBtn = document.createElement('button');
        skipBtn.className = 'auth-btn skip-btn';
        skipBtn.textContent = 'Continue without an account';
        skipBtn.onclick = () => {
          App.currentScreen = 'home';
          App.render();
        };

        card.appendChild(form);
        card.appendChild(skipBtn);
        div.appendChild(card);

        return div;
      }
    };

    window.AuthScreen = AuthScreen;

    // ─── Initialize ─────────────────────────────────────────────
    function loadFirebaseSDK(callback) {
      // Offline short-circuit: skip Firebase loading if offline
      if (!navigator.onLine) {
        callback();
        return;
      }

      let failed = false;
      
      // Timeout fallback: if Firebase hasn't loaded in 8s, proceed anyway
      const timeout = setTimeout(() => {
        console.log('Firebase SDK timeout - proceeding without cloud sync');
        failed = true;
        callback();
      }, 8000);
      
      const urls = [
        'https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js'
      ];
      let loaded = 0;
      urls.forEach(src => {
        const s = document.createElement('script');
        s.src = src;
        s.async = false; // Ensure scripts execute in order (auth-compat depends on app-compat)
        s.onload = () => {
          if (++loaded === urls.length && !failed) {
            clearTimeout(timeout);
            callback();
          }
        };
        s.onerror = () => {
          if (!failed) {
            failed = true;
            clearTimeout(timeout);
            if (loaded < urls.length) callback();
          }
        };
        document.head.appendChild(s);
      });
    }
    window.loadFirebaseSDK = loadFirebaseSDK;

    App.init();
    loadFirebaseSDK(() => {
      FirebaseSync.init();
    });

    // ─── PWA Service Worker Registration ─────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>

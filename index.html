<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A90D9">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iTaukei">
  <title>iTaukei | Na Vosa Vaka-Viti</title>
  <style>
    /* ============================================================
       iTaukei Language Learning App — Duolingo-style
       Single self-contained web app, no external services
       ============================================================ */

    :root {
      --primary: #4A90D9;
      --primary-dark: #3A7BC8;
      --secondary: #FF9F1C;
      --accent: #2EE59D;
      --bg: #F0F2F5;
      --surface: #FFFFFF;
      --surface-alt: #F8F9FA;
      --text: #1A1A1A;
      --text-secondary: #6B7280;
      --border: #E5E7EB;
      --correct: #10B981;
      --incorrect: #EF4444;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
    }

    header h1#home-logo {
      cursor: pointer;
      user-select: none;
      border-radius: 8px;
      padding: 2px 6px;
      margin: -2px -6px;
    }

    header h1#home-logo:hover,
    header h1#home-logo:focus-visible {
      background: var(--surface-alt);
      outline: none;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      font-weight: 700;
      color: var(--text);
    }

    /* Main content */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* Home / Skill Tree */
    .home-screen {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 16px;
      color: white;
    }

    .user-header .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .user-info h2 {
      font-size: 1.2rem;
    }

    .user-info p {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    /* Skill Tree Grid */
    .skill-tree {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .skill-node {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .skill-node:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .skill-node.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .skill-node.completed .skill-icon {
      color: var(--accent);
    }

    .skill-node .skill-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .skill-node .skill-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .skill-node .skill-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .skill-node .skill-xp {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 600;
    }

    .skill-node.locked .skill-icon {
      color: var(--text-secondary);
    }

    /* Lesson Screen */
    .lesson-screen {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 2px solid var(--border);
    }

    .lesson-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .lesson-progress-bar {
      width: 100%;
      height: 8px;
      background: var(--surface-alt);
      border-radius: 4px;
      overflow: hidden;
    }

    .lesson-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Exercise Cards */
    .exercise-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .exercise-prompt {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text);
    }

    /* Matching Exercise */
    .matching-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .match-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-item {
      padding: 12px 16px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: var(--surface-alt);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-weight: 500;
    }

    .match-item:hover {
      background: var(--bg);
    }

    .match-item.selected {
      border-color: var(--primary);
      background: rgba(74, 144, 217, 0.1);
    }

    .match-item.correct {
      border-color: var(--correct);
      background: rgba(16, 185, 135, 0.1);
    }

    .match-item.incorrect {
      border-color: var(--incorrect);
      background: rgba(239, 68, 68, 0.1);
    }

    .match-item.hidden {
      visibility: hidden;
    }

    /* Multiple Choice */
    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .choice-btn {
      padding: 16px 20px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--surface-alt);
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .choice-btn:hover {
      background: var(--bg);
      border-color: var(--primary);
    }

    .choice-btn.selected {
      border-color: var(--primary);
      background: rgba(74, 144, 217, 0.1);
    }

    .choice-btn.correct {
      border-color: var(--correct);
      background: rgba(16, 185, 135, 0.1);
    }

    .choice-btn.incorrect {
      border-color: var(--incorrect);
      background: rgba(239, 68, 68, 0.1);
    }

    .choice-btn:disabled {
      pointer-events: none;
    }

    /* Sentence Builder */
    .sentence-builder {
      margin-top: 16px;
    }

    .sentence-target {
      min-height: 60px;
      padding: 16px 20px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: var(--surface-alt);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 500;
    }

    .sentence-target.drag-over {
      border-color: var(--primary);
      background: rgba(74, 144, 217, 0.05);
    }

    .sentence-target.correct {
      border-color: var(--correct);
    }

    .sentence-target.incorrect {
      border-color: var(--incorrect);
    }

    .drag-words {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .drag-word {
      padding: 12px 18px;
      background: var(--primary);
      color: white;
      border-radius: 20px;
      font-weight: 600;
      cursor: grab;
      transition: all 0.2s ease;
      font-size: 1.05rem;
    }

    .drag-word:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .drag-word.dragging {
      opacity: 0.5;
      transform: rotate(5deg);
    }

    /* Typing Exercise */
    .typing-container {
      margin-top: 16px;
    }

    .typing-input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.2rem;
      text-align: center;
      margin-top: 16px;
      transition: border-color 0.2s;
    }

    .typing-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .typing-input.correct {
      border-color: var(--correct);
      background: rgba(16, 185, 135, 0.1);
    }

    .typing-input.incorrect {
      border-color: var(--incorrect);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Feedback */
    .feedback {
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1rem;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .feedback.correct {
      background: rgba(16, 185, 135, 0.15);
      color: var(--correct);
      border: 1px solid var(--correct);
    }

    .feedback.incorrect {
      background: rgba(239, 68, 68, 0.15);
      color: var(--incorrect);
      border: 1px solid var(--incorrect);
    }

    .feedback .correct-answer {
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* Action Buttons */
    .btn {
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      margin-top: 16px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-secondary:hover {
      background: rgba(74, 144, 217, 0.1);
    }

    .btn-block {
      width: 100%;
      margin-top: 8px;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    /* Completion Screen */
    .completion-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .completion-icon {
      font-size: 5rem;
      margin-bottom: 20px;
    }

    .completion-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .completion-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .xp-gain {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 24px;
    }

    /* Source attribution */
    .sources-note {
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--surface-alt);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .sources-note strong {
      color: var(--text);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .bounce {
      animation: bounce 0.6s ease;
    }

    /* Streak flame */
    .streak-active {
      color: var(--secondary);
      animation: flameFlicker 2s infinite;
    }

    @keyframes flameFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    /* Pronunciation hint (inline phonetic guide) */
    .pronunciation-hint {
      margin-top: 8px;
      padding: 6px 10px;
      background: var(--surface-alt);
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Review badge */
    .review-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--secondary);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1012;
        --surface: #1A1B1E;
        --surface-alt: #25262A;
        --text: #F0F0F0;
        --text-secondary: #A0A0A8;
        --border: #33353A;
        --shadow: 0 2px 8px rgba(0,0,0,0.2);
        --shadow-lg: 0 4px 20px rgba(0,0,0,0.3);
      }
    }

    /* Streak freeze indicator */
    .streak-freeze-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--secondary);
      font-weight: 600;
    }

    /* Daily goal progress bar */
    .goal-container {
      margin-bottom: 24px;
    }
    .goal-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .goal-bar {
      width: 100%;
      height: 10px;
      background: var(--surface-alt);
      border-radius: 5px;
      overflow: hidden;
    }
    .goal-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 20px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .modal h3 {
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .modal p {
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container { padding: 16px 8px 80px; }
      header { padding: 12px 16px; }
      .matching-container { grid-template-columns: 1fr; }
      .matching-container .match-column:nth-child(1) { order: 2; }
      .matching-container .match-column:nth-child(2) { order: 1; }
      .nav-buttons { flex-direction: column; }
    }

    /* Pronunciation Guide */
    .pronounce-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 0.95rem;
    }

    .pronounce-table th, .pronounce-table td {
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .pronounce-table th {
      background: var(--surface-alt);
      font-weight: 600;
      color: var(--primary);
    }

    .pronounce-table .sound-cell {
      font-family: monospace;
      font-weight: 700;
      color: var(--secondary);
    }

    .pronounce-tips {
      list-style: none;
      padding: 0;
      margin-top: 16px;
    }

    .pronounce-tips li {
      padding: 10px 16px;
      background: var(--surface-alt);
      border-radius: 10px;
      margin-bottom: 8px;
      padding-left: 40px;
      position: relative;
    }

    .pronounce-tips li:before {
      content: "💡";
      position: absolute;
      left: 12px;
      top: 10px;
    }

    /* Sources Page */
    .sources-list {
      list-style: none;
      padding: 0;
      margin-top: 16px;
    }

    /* Firebase auth screen */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--surface);
      color: var(--text);
    }

    .auth-card {
      background: var(--surface-alt);
      border-radius: 16px;
      padding: 32px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .auth-card h2 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      color: var(--text);
    }

    .auth-card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
    }

    .auth-form input:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }

    .auth-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .google-btn { background: #4285f4; color: white; }
    .google-btn:hover { background: #3367d6; }

    .email-btn { background: var(--primary); color: white; }
    .email-btn:hover { background: var(--primary-dark); }

    .skip-btn {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      margin-top: 16px;
    }

    .skip-btn:hover { color: var(--text); }

    .auth-error {
      color: var(--error, #ff4444);
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .sources-list li {
      padding: 10px 16px;
      background: var(--surface-alt);
      border-radius: 10px;
      margin-bottom: 8px;
      border-left: 3px solid var(--primary);
    }
  </style>

<body>
  <header>
    <h1 id="home-logo" role="button" tabindex="0" aria-label="Go to home screen">🌺 iTaukei</h1>
    <div class="header-stats">
      <div class="stat-item">
        <span>🔥</span>
        <span class="stat-value" id="streak-count">0</span>
        <span>day streak</span>
      </div>
      <div class="stat-item">
        <span>⭐</span>
        <span class="stat-value" id="xp-count">0</span>
        <span>XP</span>
      </div>
      <button id="review-btn" class="btn btn-secondary" style="padding: 6px 16px; font-size: 0.85rem;">
        📚 Review</button>
      <button id="sync-btn" class="btn btn-secondary" style="padding: 6px 16px; font-size: 0.85rem;">
        ☁️ Sync</button>
      <button id="settings-btn" class="btn btn-secondary" style="padding: 6px 16px; font-size: 0.85rem;">
        ⚙️ Settings</button>
    </div>
  </header>

  <div class="container" id="app-container">
    <!-- Content loaded by app.js -->
  </div>

  <script src="data.js"></script>
  <script>
    // ============================================================
    // iTaukei Language Learning App — Main JavaScript
    // ═══════════════════════════════════════════════════════════
    // Self-contained, uses localStorage for persistence
    // ============================================================

    // ─── Data Manager ──────────────────────────────────────────
    const DataManager = {
      // Progress is stored in localStorage under key 'taukei_progress'
      _progressCache: null,

      get progress() {
        if (this._progressCache) {
          return this._progressCache;
        }
        const raw = localStorage.getItem('taukei_progress');
        if (raw) {
          try {
            return this._progressCache = JSON.parse(raw);
          } catch(e) {
            console.warn('Corrupted progress data in localStorage, resetting to defaults', e);
            localStorage.removeItem('taukei_progress');
            this._progressCache = this._defaultProgress();
            return this._progressCache;
          }
        }
        this._progressCache = this._defaultProgress();
        return this._progressCache;
      },

      _defaultProgress() {
        return {
          xp: 0,
          streak: 0,
          streakFreezes: 3,
          dailyGoal: 50,
          todayXP: 0,
          lastXPDay: null,
          lastActive: null,
          completedLessons: [],
          lessonMastery: {},
          wrongAnswers: [],
          totalXP: {}
        };
      },

      saveProgress() {
        // Write to localStorage (always — this is the source of truth for offline use)
        const p = this.progress;
        p.lastModified = Date.now();
        localStorage.setItem('taukei_progress', JSON.stringify(p));

        // Sync to Firestore if user is signed in
        if (window.FirebaseSync && window.FirebaseSync.isSignedIn() && !window.FirebaseSync.syncInProgress) {
          window.FirebaseSync.syncProgress(p);
        }
      },

      addXP(amount) {
        const p = this.progress;
        p.xp += amount;
        this.saveProgress();
        // Trigger header update
        App.updateHeader();

      completeLesson(lessonId, masteryPercent) {
        const p = this.progress;
        if (!p.completedLessons.includes(lessonId)) {
          p.completedLessons.push(lessonId);
        }
        // Store mastery as a percentage (can decay over time later)
        // Use != null check to handle 0% mastery correctly (0 is a valid value)
        p.lessonMastery[lessonId] = masteryPercent != null ? masteryPercent : 100;
        this.saveProgress();
        App.checkUnlocks();
      },

      // Shared by recordWrongAnswer() and recordCorrectAnswer() to build
      // the "first encounter" tracked-entry object. All fields that are
      // identical across both branches live here in one place; callers pass
      // only the fields that differ via extraFields.
      _buildTrackedEntry(exercise, extraFields) {
        return {
          exerciseId: exercise.id || JSON.stringify(exercise),
          prompt: exercise.prompt,
          answer: exercise.answer,
          type: exercise.type,
          choices: exercise.choices || null,
          pairs: exercise.pairs || null,
          words: exercise.words || null,
          explanation: exercise.explanation || null,
          note: exercise.note || null,
          sources: exercise.sources || null,
          ...extraFields
        };
      },

      recordWrongAnswer(exercise) {
        const p = this.progress;
        const exerciseId = exercise.id || JSON.stringify(exercise);
        // Check if already tracked — update existing, or create new
        const existing = p.wrongAnswers.find(wa => wa.exerciseId === exerciseId);
        const now = Date.now();
        const dayInMs = 24 * 60 * 60 * 1000;

        if (existing) {
          // Wrong answer on an already-tracked item: reset to shortest interval
          existing.timestamp = now;
          existing.reviewCount = 0;
          existing.nextReviewAt = now + 1 * dayInMs; // review again in 1 day
          existing.correctStreak = 0;
          existing.mastered = false; // un-graduate: a mastered item got wrong again
        } else {
          p.wrongAnswers.push(this._buildTrackedEntry(exercise, {
            timestamp: now,
            reviewCount: 0,
            nextReviewAt: now + 1 * dayInMs, // first review: 1 day
            intervalIndex: 0
          }));
        }
        this.saveProgress();
      },

      recordCorrectAnswer(exercise) {
        // Add correctly-answered items to the spaced repetition pool
        // with a longer initial delay
        const p = this.progress;
        const exerciseId = exercise.id || JSON.stringify(exercise);
        const existing = p.wrongAnswers.find(wa => wa.exerciseId === exerciseId);
        const now = Date.now();
        const dayInMs = 24 * 60 * 60 * 1000;

        if (existing) {
          // Already in pool — correct answer means advance the interval
          const intervals = [1, 3, 7, 14, 30, 90]; // days: Leitner-like
          existing.intervalIndex = Math.min(existing.intervalIndex + 1, intervals.length - 1);
          existing.nextReviewAt = now + intervals[existing.intervalIndex] * dayInMs;
          existing.lastCorrect = now;
          // Graduation: after 2 consecutive correct at max interval, mark mastered
          if (existing.intervalIndex >= intervals.length - 1) {
            existing.correctStreak = (existing.correctStreak || 0) + 1;
            if (existing.correctStreak >= 2) {
              existing.mastered = true;
            }
          } else {
            existing.correctStreak = 0;
          }
        } else {
          // Correct answer on first encounter — add to pool with longer delay
          p.wrongAnswers.push(this._buildTrackedEntry(exercise, {
            timestamp: now,
            reviewCount: 0,
            nextReviewAt: now + 7 * dayInMs, // first review for correct: 7 days
            intervalIndex: 2,
            lastCorrect: now
          }));
        }
        this.saveProgress();
      },

      updateStreak() {
        const p = this.progress;
        const today = new Date().toDateString();
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        const dayInMs = 24 * 60 * 60 * 1000;

        // Already active today, nothing to change
        if (p.lastActive === today) {
          return;
        }

        if (p.lastActive && p.lastActive !== today) {
          // Calculate how many days were missed
          const lastDate = new Date(p.lastActive);
          const daysSince = Math.floor((Date.now() - lastDate.getTime()) / dayInMs);

          if (daysSince === 1) {
            // Just yesterday — streak continues
            p.streak += 1;
          } else if (daysSince > 1) {
            // Missed days — use a freeze for each missed day
            const freezesNeeded = daysSince - 1;
            if ((p.streakFreezes || 0) >= freezesNeeded) {
              p.streakFreezes -= freezesNeeded;
              p.streak += 1; // Streak saved (only counts today as active)
            } else if ((p.streakFreezes || 0) > 0) {
              // Partial freeze coverage — cover some missed days, streak still breaks
              const covered = p.streakFreezes;
              p.streakFreezes = 0;
              p.streak = 1;
              console.log(`Partial freeze: covered ${covered} of ${freezesNeeded} missed days`);
            } else {
              // No freezes — streak broken
              p.streak = 1;
            }
          }
        } else {
          // First day ever
          p.streak = 1;
        }

        p.lastActive = today;
        this.saveProgress();
        App.updateHeader();
      },

      getWrongAnswersForReview() {
        const now = Date.now();
        return this.progress.wrongAnswers.filter(wa =>
          !wa.mastered && wa.nextReviewAt && wa.nextReviewAt <= now
        );
      },

      getReviewCount() {
        return this.getWrongAnswersForReview().length;
      },

      useStreakFreeze() {
        const p = this.progress;
        if (p.streakFreezes > 0) {
          p.streakFreezes -= 1;
          this.saveProgress();

        return false;

        }
        p.todayXP = (p.todayXP || 0) + amount;

      },

      importProgress(newProgress) {

    // ─── Firebase Sync (Optional Cloud Sync) ─────────────────────
    // Sign-in is OPTIONAL. The app works fully offline with just localStorage.
    // Firebase sync is an opt-in feature for cross-device progress sync.
    const FirebaseSync = {
      db: null,
      auth: null,
      currentUser: null,
      syncInProgress: false,

      init() {
        if (typeof firebase === 'undefined') {
          console.log('Firebase SDK not loaded — running in offline-only mode');
          return;
        }
        try {
          firebase.initializeApp(firebaseConfig);
          this.auth = firebase.auth();
          this.db = firebase.firestore();
          // Listen for auth state changes
          this.auth.onAuthStateChanged(user => {
            this.currentUser = user;
            if (user) {
              this.onSignIn(user);
            } else {
              this.onSignOut();
            }
          });
        } catch(e) {
          console.error('Firebase init failed:', e);
        }
      },

      isSignedIn() {
        return !!this.currentUser;
      },

      async onSignIn(user) {
        const localProgress = DataManager.progress;
        try {
          const doc = await this.db.collection('users').doc(user.uid).get();
          if (doc.exists) {
            const cloudProgress = doc.data().progress;
            const cloudTime = cloudProgress.lastModified || 0;
            const localTime = localProgress.lastModified || 0;
            // Most-recent-modified wins
            if (cloudTime > localTime) {
              // Cloud is newer — use it
              DataManager._progressCache = { ...cloudProgress };
              // Re-save to localStorage to keep them in sync
              localStorage.setItem('taukei_progress', JSON.stringify(DataManager.progress));
              // Update streak check with new data
              DataManager.updateStreak();
            } else {
              // Local is newer or same — push to cloud
              await this.saveToFirestore(localProgress);
            }
          } else {
            // New user — create their document
            await this.saveToFirestore(localProgress);
          }
          App.updateHeader(); // Refresh header with sync status
          // Navigate back to home if currently on auth screen
          if (App.currentScreen === 'auth') {
            App.currentScreen = 'home';
            App.render();
          }
        } catch(e) {
          console.error('Sign-in sync failed:', e);
          // Fall back to local-only mode
          App.updateHeader();
          if (App.currentScreen === 'auth') {
            App.currentScreen = 'home';
            App.render();
          }
        }
      },

      onSignOut() {
        // Nothing to do — local data stays in localStorage
        App.updateHeader();
        // If currently on auth screen, redirect to home
        if (App.currentScreen === 'auth') {
          App.currentScreen = 'home';
          App.render();
        }
      },

      async saveToFirestore(progress) {
        if (!this.currentUser || this.syncInProgress) return;
        this.syncInProgress = true;
        try {
          await this.db.collection('users').doc(this.currentUser.uid).set({
            progress: progress,
            lastModified: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch(e) {
          console.error('Firestore write failed:', e);
          // Data stays in localStorage — retry on next save
        } finally {
          this.syncInProgress = false;
        }
      },

      // Throttled sync — only writes if not recently synced
      syncProgress(progress) {
        const lastSync = localStorage.getItem('last_firestore_sync');
        const now = Date.now();
        if (lastSync && now - parseInt(lastSync) < 2000) {
          // Throttle to once per 2 seconds
          return;
        }
        localStorage.setItem('last_firestore_sync', now.toString());
        this.saveToFirestore(progress);
      },

      signUpWithEmail(email, password) {
        return this.auth.createUserWithEmailAndPassword(email, password);
      },

      signInWithEmail(email, password) {
        return this.auth.signInWithEmailAndPassword(email, password);

        return this.auth.signInWithPopup(provider);
      },

      signOut() {
        return this.auth.signOut();
      }
    };

    // ─── Phonetic Helper ──────────────────────────────────────
    // Convert Fijian words to English-approximate respelling
    function fijianToPhonetic(text) {
      if (!text) return text;
      let result = text.toLowerCase();
      // Fijian consonant pronunciations: c=th, q=ng, d=nd, g=ng, b=mb
      // Note: these replacements are context-sensitive in real Fijian,
      // but this gives a reasonable approximation for learning purposes
      result = result.replace(/c/g, 'th');   // c -> th (as in "thin")
      result = result.replace(/q/g, 'ng');   // q -> ng (as in "sing")
      result = result.replace(/d/g, 'nd');   // d -> nd (as in "candy")
      result = result.replace(/g/g, 'ng');   // g -> ng (as in "finger")
      result = result.replace(/b/g, 'mb');   // b -> mb (prenasalized)
      // Vowels are straightforward
      // au -> ow (as in "how")
      result = result.replace(/au/g, 'ow');
      return result;
    }

    // Normalize text for answer-comparison: lowercase, collapse whitespace,
    // and strip diacritics (e.g. macrons like "ū") via Unicode NFD
    // decomposition so answers typed on a plain keyboard ("tu") still match
    // an answer key that uses the correct diacritic ("tū"). Exposed on
    // window so the regression harness (test.html) can exercise the exact
    // comparison logic the typing exercise uses, not a re-implementation.
    function normalizeForCompare(s) {
      return s.trim().toLowerCase().replace(/\s+/g, ' ')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    window.normalizeForCompare = normalizeForCompare;

    // Like normalizeForCompare but also strips ALL whitespace and punctuation.
    // Used by renderSentenceBuilder where placed words are concatenated
    // without spaces, so word boundaries come from separate tiles, not
    // from spaces or punctuation in the text content.
    function normalizeSentence(s) {
      return normalizeForCompare(s).replace(/[^\w]/g, '');
    }
    window.normalizeSentence = normalizeSentence;

    // Add inline phonetic guide to exercise prompt

      const phonetic = fijianToPhonetic(fijianText);

      hint.className = 'pronunciation-hint';
      hint.innerHTML = `<small>(${phonetic})</small>`;
      promptEl.appendChild(hint);
    }

        }
        div.appendChild(this.renderNoteCard('<strong>Account & Sync</strong><br><small style="color:#666">' + accountText + '</small>'));

        const accountBtn = document.createElement('button');
        accountBtn.className = 'btn btn-secondary';
        if (window.FirebaseSync && FirebaseSync.isSignedIn()) {
          accountBtn.textContent = '🔓 Sign Out';
          accountBtn.onclick = () => {
            if (confirm('Sign out? You will stop syncing to the cloud.')) {
              FirebaseSync.signOut();
              this.render();
            }
          };
        } else {
          accountBtn.textContent = '☁️ Sign In / Enable Sync';
          accountBtn.onclick = () => { App.currentScreen = 'auth'; App.render(); };
        }
        div.appendChild(accountBtn);

        // Section: Backup
        div.appendChild(this.renderNoteCard('<strong>Backup</strong><br><small style="color:#666">Export or import your progress as a JSON file. Useful for switching devices or making a manual backup.</small>'));

        const backupRow = document.createElement('div');
        backupRow.style.display = 'flex';
        backupRow.style.flexWrap = 'wrap';
        backupRow.style.gap = '12px';

        const exportBtn = document.createElement('button');
        exportBtn.className = 'btn btn-secondary';
        exportBtn.textContent = '⬇️ Export Progress';
        exportBtn.onclick = () => { App.exportProgress(); };
        backupRow.appendChild(exportBtn);

        const importBtn = document.createElement('button');
        importBtn.className = 'btn btn-secondary';
        importBtn.textContent = '⬆️ Import Progress';

        const importInput = document.createElement('input');
        importInput.type = 'file';
        importInput.accept = 'application/json';
        importInput.style.display = 'none';
        importInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          importInput.value = '';
          if (file) App.importProgressFile(file);
        });

        importBtn.onclick = () => importInput.click();
        backupRow.appendChild(importBtn);
        backupRow.appendChild(importInput);
        div.appendChild(backupRow);

        // Section: Mastered Words
        const mastered = DataManager.getMasteredWords();
        div.appendChild(this.renderNoteCard('<strong>Mastered Words (' + mastered.length + ')</strong>'));

        if (mastered.length === 0) {
          const emptyMsg = document.createElement('div');
          emptyMsg.style.color = '#666';
          emptyMsg.textContent = '\u2713 Nothing mastered yet — keep practicing!';
          div.appendChild(emptyMsg);
        } else {
          const list = document.createElement('div');
          list.style.maxHeight = '200px';
          list.style.overflowY = 'auto';
          mastered.forEach(wa => {
            const item = document.createElement('div');
            item.style.padding = '6px 0';
            item.style.borderBottom = '1px solid #e0e0e0';
            item.innerHTML = '<strong>' + wa.prompt + '</strong>' +
              (wa.answer ? ' \u2192 ' + wa.answer : '') +
              (wa.type ? ' <small>(' + wa.type + ')</small>' : '');
            list.appendChild(item);
          });
          div.appendChild(list);
        }

        // Back button
        const backBtn = document.createElement('button');
        backBtn.className = 'btn btn-secondary';
        backBtn.textContent = '← Back to Skills';
        backBtn.style.marginTop = '20px';
        backBtn.onclick = () => { App.currentScreen = 'home'; App.render(); };
        div.appendChild(backBtn);

        return div;
      },

      // Downloads the current progress object as a timestamped JSON file.
      exportProgress() {
        const data = JSON.stringify(DataManager.progress, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const dateStamp = new Date().toISOString().slice(0, 10);
        a.download = `taukei-progress-${dateStamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      },

      // Reads a user-selected JSON file, does a light sanity check that it
      // looks like a progress export, confirms with the user (this
      // overwrites current progress), then hands it to DataManager.
      importProgressFile(file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          let parsed;
          try {
            parsed = JSON.parse(evt.target.result);
          } catch (err) {
            alert("That file isn't valid JSON — import cancelled.");
            return;
          }
          const looksValid = parsed && typeof parsed === 'object' &&
            typeof parsed.xp === 'number' && Array.isArray(parsed.completedLessons);
          if (!looksValid) {
            alert("That file doesn't look like a taukei progress export — import cancelled.");
            return;
          }
          const ok = confirm(
            'Importing will replace your current progress (XP, streak, completed lessons, review queue) ' +
            'with the contents of this file. This cannot be undone. Continue?'
          );
          if (!ok) return;
          DataManager.importProgress(parsed);
          this.checkUnlocks();
          this.updateHeader();
          this.render();
          alert('Progress imported successfully.');
        };
        reader.onerror = () => {
          alert('Could not read that file — import cancelled.');
        };
        reader.readAsText(file);
      },

      startLesson(lessonId) {
        this.currentLesson = LESSONS[lessonId];
        this.currentLesson.id = lessonId;
        this.currentExerciseIndex = 0;
        this.exerciseResults = [];
        this.reviewMode = false;
        this.currentScreen = 'lesson';
        this.render();
      },

      // Reconstruct exercise objects from stored wrongAnswers entries, so a
      // review session shows the same prompt/choices/explanation as the
      // original lesson. Shared by both entry points into review mode
      // (the header/skill-tree "Review" button and the review screen itself)
      // so there's exactly one place that knows how to rebuild an exercise
      // from a wrongAnswers record.
      buildReviewExercises(wrongAnswers) {
        return wrongAnswers.map(wa => {
          const exercise = {
            type: wa.type,
            prompt: wa.prompt,
            answer: wa.answer,
            id: wa.exerciseId
          };
          if (wa.choices) exercise.choices = wa.choices;
          if (wa.pairs) exercise.pairs = wa.pairs;
          if (wa.words) exercise.words = wa.words;
          if (wa.explanation) exercise.explanation = wa.explanation;
          if (wa.note) exercise.note = wa.note;
          if (wa.sources) exercise.sources = wa.sources;
          return exercise;
        });
      },

      // Set up App state for a review session from a list of due
      // wrongAnswers entries. Does not render — callers render afterward
      // in whichever way fits their context (see startReview/renderReview).
      startReviewWith(wrongAnswers) {
        this.currentLesson = {
          title: 'Review',
          description: 'Practice answers you got wrong',
          xp: 50,
          exercises: this.buildReviewExercises(wrongAnswers),
          isReview: true,
          id: 'review'
        };
        this.currentExerciseIndex = 0;
        this.exerciseResults = [];
        this.reviewMode = true;
        this.currentScreen = 'lesson';
      },

      startReview() {
        const wrong = DataManager.getWrongAnswersForReview();
        if (wrong.length === 0) return;
        this.startReviewWith(wrong);
        this.render();
      },

      renderLesson() {
        const lesson = this.currentLesson;
        const exercise = lesson.exercises[this.currentExerciseIndex];
        const isLast = this.currentExerciseIndex === lesson.exercises.length - 1;

        const div = document.createElement('div');
        div.className = 'lesson-screen';

        // Header
        const header = document.createElement('div');
        header.className = 'lesson-header';
        header.innerHTML = `
          <div class="lesson-title">${lesson.title}</div>
        `;

        // Progress bar
        const totalExercises = lesson.exercises.length;
        const progressPercent = ((this.currentExerciseIndex + 1) / totalExercises) * 100;
        header.innerHTML += `
          <div class="lesson-progress-bar">
            <div class="lesson-progress-fill" style="width: ${progressPercent}%"></div>
          </div>
        `;
        div.appendChild(header);

        // Exercise
        const exerciseDiv = this.renderExercise(exercise);
        div.appendChild(exerciseDiv);

        // Navigation
        const nav = document.createElement('div');
        nav.className = 'nav-buttons';

        if (isLast) {
          const completeBtn = document.createElement('button');
          completeBtn.className = 'btn btn-primary btn-block';
          completeBtn.textContent = 'Finish Lesson';
          completeBtn.addEventListener('click', () => {
            this.finishLesson();
          });
          nav.appendChild(completeBtn);
        } else {
          const nextBtn = document.createElement('button');
          nextBtn.className = 'btn btn-primary btn-block';
          nextBtn.textContent = 'Next';
          nextBtn.addEventListener('click', () => {
            this.nextExercise();
          });
          nav.appendChild(nextBtn);
        }

        div.appendChild(nav);

        return div;
      },

      renderExercise(exercise) {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.id = `exercise-${this.currentExerciseIndex}`;

        const promptEl = document.createElement('div');
        promptEl.className = 'exercise-prompt';
        promptEl.textContent = exercise.prompt;

        // Add inline pronunciation hint for exercises with Fijian content
        if (exercise.type === 'typing' && exercise.answer) {
          const hint = document.createElement('div');
          hint.className = 'pronunciation-hint';
          hint.textContent = `Pronunciation: ${fijianToPhonetic(exercise.answer)}`;
          promptEl.appendChild(hint);
        } else if (exercise.type === 'sentence_builder' && exercise.answer) {
          const hint = document.createElement('div');
          hint.className = 'pronunciation-hint';
          hint.textContent = `Answer pronunciation: ${fijianToPhonetic(exercise.answer)}`;
          promptEl.appendChild(hint);
        }

        card.appendChild(promptEl);

        switch (exercise.type) {
          case 'multiple_choice':
            card.appendChild(this.renderMultipleChoice(exercise));
            break;
          case 'matching':
            card.appendChild(this.renderMatching(exercise));
            break;
          case 'sentence_builder':
            card.appendChild(this.renderSentenceBuilder(exercise));
            break;
          case 'typing':
            card.appendChild(this.renderTyping(exercise));
            break;
        }

        // Sources
        if (exercise.sources) {
          const src = document.createElement('div');
          src.className = 'sources-note';
          src.innerHTML = `<strong>Sources:</strong> ${exercise.sources.map(s => SOURCES[s] || s).join(', ')}`;
          card.appendChild(src);
        }

        return card;
      },

      renderMultipleChoice(exercise) {
        const div = document.createElement('div');
        div.className = 'choice-list';

        exercise.choices.forEach((choice, i) => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = choice;
          btn.dataset.index = i;
          btn.addEventListener('click', () => {
            this.selectChoice(exercise, i);
          });
          div.appendChild(btn);
        });

        return div;
      },

      selectChoice(exercise, index) {
        const buttons = document.querySelectorAll('.choice-btn');
        buttons.forEach(b => b.disabled = true);

        const selected = buttons[index];
        const isCorrect = index === exercise.answer;

        if (isCorrect) {
          selected.classList.add('correct');
        } else {
          selected.classList.add('incorrect');
          buttons[exercise.answer].classList.add('correct');
        }
        this.recordResult(exercise, isCorrect);

        // Show feedback
        const card = document.getElementById(`exercise-${this.currentExerciseIndex}`);
        let message = isCorrect ? '✓ Correct!' : `✗ Incorrect. ${exercise.explanation || ''}`;
        if (!isCorrect && exercise.explanation) {
          message += ` <br><strong>Correct answer:</strong> ${exercise.choices[exercise.answer]}`;
        }
        this.showFeedback(card, isCorrect ? 'correct' : 'incorrect', message);
      },

      renderMatching(exercise) {
        const container = document.createElement('div');
        container.className = 'matching-container';

        const leftColumn = document.createElement('div');
        leftColumn.className = 'match-column';
        leftColumn.style.order = '1';

        const rightColumn = document.createElement('div');
        rightColumn.className = 'match-column';
        rightColumn.style.order = '2';

        // For mobile: show English first, then Fijian (swap order)
        container.className = 'matching-container';

        // Shuffle pairs independently for each column
        const fijianWords = [...exercise.pairs].map(p => p.fijian || p.english).sort(() => Math.random() - 0.5);
        const englishWords = [...exercise.pairs].map(p => p.english || p.fijian).sort(() => Math.random() - 0.5);

        // Create a lookup to map words back to their pair index
        const pairMap = {};
        exercise.pairs.forEach((pair, idx) => {
          const fijian = pair.fijian || pair.english;
          const english = pair.english || pair.fijian;
          pairMap[fijian] = idx;
          pairMap[english] = idx;
        });

        let selectedLeft = null;
        let matches = {};
        let completed = false;
        let wrongCount = 0;
        let correctCount = 0;

        // Render English column (right side / answers)
        englishWords.forEach((word, i) => {
          const item = document.createElement('div');
          item.className = 'match-item';
          item.textContent = word;
          item.dataset.pairKey = pairMap[word];
          item.dataset.column = 'right';
          item.setAttribute('role', 'button');
          item.setAttribute('tabindex', '0');
          item.setAttribute('aria-label', `English meaning: ${word}. Click or press Enter to match.`);
          rightColumn.appendChild(item);

          const handleMatch = () => {
            if (completed || !selectedLeft) return;
            const pairKey = selectedLeft.dataset.pairKey;
            const isMatch = pairKey === item.dataset.pairKey;

            if (isMatch) {
              item.classList.add('correct');
              selectedLeft.classList.add('correct');
              selectedLeft.classList.remove('selected');
              selectedLeft = null;
              matches[pairKey] = true;
              correctCount++;

              // Check if all matched
              const allMatched = Object.keys(matches).length === exercise.pairs.length;
              if (allMatched) {
                completed = true;
                const card = document.getElementById(`exercise-${this.currentExerciseIndex}`);
                // Record wrong attempts for review, or correct first-try for spaced rep
                this.recordResult(exercise, wrongCount === 0);
                const message = wrongCount > 0
                  ? `✓ All matched! (${wrongCount} incorrect attempt${wrongCount > 1 ? 's' : ''} — review recommended)`
                  : '✓ All matched correctly!';
                this.showFeedback(card, 'correct', message);
              }
            } else {
              wrongCount++;
              selectedLeft.classList.remove('selected');
              selectedLeft = null;

              // Brief flash then reset
              item.classList.add('incorrect');
              setTimeout(() => {
                item.classList.remove('incorrect');
              }, 500);
            }
          };

          item.addEventListener('click', handleMatch);
          item.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              handleMatch();
            }
          });
        });

        // Render Fijian column (left side / prompts)
        fijianWords.forEach((word, i) => {
          const item = document.createElement('div');
          item.className = 'match-item';
          item.dataset.pairKey = pairMap[word];
          item.dataset.fijianWord = word;
          item.textContent = word;
          item.setAttribute('role', 'button');
          item.setAttribute('tabindex', '0');
          item.setAttribute('aria-label', `Fijian word: ${word}. Click or press Enter to select.`);

          leftColumn.appendChild(item);

          const handleSelect = () => {
            if (completed) return;
            if (selectedLeft && selectedLeft !== item) {
              selectedLeft.classList.remove('selected');
            }
            selectedLeft = item;
            item.classList.add('selected');
          };

          item.addEventListener('click', handleSelect);
          item.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              handleSelect();
            }
          });
        });

        container.appendChild(leftColumn);
        container.appendChild(rightColumn);

        return container;
      },

      renderSentenceBuilder(exercise) {
        const div = document.createElement('div');
        div.className = 'sentence-builder';

        // Target area
        const target = document.createElement('div');
        target.className = 'sentence-target';
        target.dataset.answer = normalizeSentence(exercise.answer);
        div.appendChild(target);

        // Drag words
        const dragContainer = document.createElement('div');
        dragContainer.className = 'drag-words';

        let completed = false;
        let resultPushed = false;
        let wrongAttempts = 0;
        let droppedCount = 0;

        // Shuffle words
        const shuffledWords = [...exercise.words].sort(() => Math.random() - 0.5);

        shuffledWords.forEach((word, i) => {
          const wordEl = document.createElement('div');
          wordEl.className = 'drag-word';
          wordEl.draggable = true;
          wordEl.dataset.index = i;
          wordEl.textContent = word;
          wordEl.setAttribute('role', 'button');
          wordEl.setAttribute('tabindex', '0');
          wordEl.setAttribute('aria-label', `Word: ${word}. Drag or press Enter to place.`);

          // Click-to-place as keyboard alternative to drag-and-drop
          wordEl.addEventListener('click', () => {
            if (completed) return;
            if (wordEl.style.visibility === 'hidden') return;
            // Simulate drag-and-drop by dispatching a drop event
            const dropEvent = new DragEvent('drop', {
              dataTransfer: new DataTransfer(),
              bubbles: true
            });
            dropEvent.dataTransfer.setData('text/plain', word);
            target.dispatchEvent(dropEvent);
          });

          wordEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              wordEl.click();
            }
          });
          wordEl.addEventListener('dragstart', (e) => {
            wordEl.classList.add('dragging');
            e.dataTransfer.setData('text/plain', word);
          });

          wordEl.addEventListener('dragend', () => {
            wordEl.classList.remove('dragging');
          });

          dragContainer.appendChild(wordEl);
        });

        div.appendChild(dragContainer);

        // Target drop handler
        target.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!completed) {
            target.classList.add('drag-over');
          }
        });

        target.addEventListener('dragleave', () => {
          target.classList.remove('drag-over');
        });

        target.addEventListener('drop', (e) => {
          if (completed) return;
          e.preventDefault();
          target.classList.remove('drag-over');
          const word = e.dataTransfer.getData('text/plain');

          // Check if word is already used
          if (target.dataset.used && target.dataset.used.includes(word)) {
            return;
          }

          // Track attempts
          droppedCount++;
          const placedWords = target.querySelectorAll('.sentence-word');
          const current = Array.from(placedWords).map(w => w.textContent).join('');
          const answer = normalizeSentence(exercise.answer);

          // If we have more words than the answer, it's a wrong attempt
          const normalizedTyped = normalizeSentence(current + ' ' + word);
          if (normalizedTyped !== answer && normalizedTyped.length > answer.length) {
            wrongAttempts++;
          }

          const span = document.createElement('span');
          span.textContent = word;
          span.className = 'sentence-word';
          target.appendChild(span);

          if (!target.dataset.used) target.dataset.used = '';
          target.dataset.used += word + ',';

          // Hide the original drag word
          const dragWords = dragContainer.querySelectorAll('.drag-word');
          dragWords.forEach(w => {
            if (w.textContent === word && !w.closest('.sentence-target')) {
              w.style.visibility = 'hidden';
            }
          });

          // Check if correct — recheck with all placed words
          const words = target.querySelectorAll('.sentence-word');
          const current2 = Array.from(words).map(w => w.textContent).join('');
          const answer2 = normalizeSentence(exercise.answer);

          if (normalizeSentence(current2) === answer2 && current2.length > 0) {
            completed = true;
            target.classList.add('correct');
            target.classList.remove('incorrect');

            if (!resultPushed) {
              resultPushed = true;
              // Record wrong attempts for review, or correct first-try for spaced rep
              this.recordResult(exercise, wrongAttempts === 0);
            }

            // Show feedback
            const card = target.closest('.exercise-card');
            const message = wrongAttempts > 0
              ? `✓ Correct! (${wrongAttempts} wrong attempt${wrongAttempts > 1 ? 's' : ''} — review recommended)`
              : '✓ Correct!';
            this.showFeedback(card, 'correct', message);
          }
        });

        return div;
      },

      renderTyping(exercise) {
        const div = document.createElement('div');
        div.className = 'typing-container';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'typing-input';
        input.placeholder = 'Type your answer here...';

        const checkAnswer = () => {
          if (input.disabled) return;
          const typed = normalizeForCompare(input.value);
          const answer = normalizeForCompare(exercise.answer);
          const altAnswers = (exercise.altAnswers || []).map(a => normalizeForCompare(a));
          const isCorrect = typed === answer || altAnswers.some(a => typed === a);
          if (isCorrect) {
            input.classList.add('correct');
            input.classList.remove('incorrect');
          } else {
            input.classList.add('incorrect');
            input.classList.remove('correct');
          }
          this.recordResult(exercise, isCorrect);

          // Show feedback
          const card = document.getElementById(`exercise-${this.currentExerciseIndex}`);

          if (isCorrect) {
            this.showFeedback(card, 'correct', '✓ Correct!');
          } else {
            this.showFeedback(card, 'incorrect', `✗ Incorrect. The correct answer is: <span class="correct-answer">${exercise.answer}</span>`);
          }

          input.disabled = true;
        };

        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            checkAnswer();
          }
        });

        div.appendChild(input);

        // Add Check button as a redundant submit path for touch devices
        const checkBtn = document.createElement('button');
        checkBtn.className = 'btn btn-secondary btn-block';
        checkBtn.textContent = 'Check Answer';
        checkBtn.style.marginTop = '12px';
        checkBtn.addEventListener('click', checkAnswer);
        div.appendChild(checkBtn);

        if (exercise.note) {
          const note = document.createElement('div');
          note.className = 'sources-note';
          note.innerHTML = `<strong>💡 Note:</strong> ${exercise.note}`;
          div.appendChild(note);
        }

        return div;
      },

      nextExercise() {
        // Update streak when user progresses to next exercise (real practice)
        DataManager.updateStreak();
        this.currentExerciseIndex++;
        this.render();
      },

      finishLesson() {
        const lesson = this.currentLesson;
        let totalXP = 0;

        // Calculate XP based on accuracy
        const correct = this.exerciseResults.filter(r => r.correct).length;
        const total = lesson.exercises.length;
        const accuracy = total > 0 ? correct / total : 0;

        if (accuracy > 0) {
          // XP based on mastery (full XP at 100%, proportional otherwise)
          totalXP = Math.round(lesson.xp * accuracy);
          if (accuracy === 1) totalXP = lesson.xp;
          if (accuracy >= 0.8) totalXP = Math.round(lesson.xp * 0.9);
        }

        DataManager.addXP(totalXP);

        if (lesson.id && !lesson.isReview) {
          DataManager.completeLesson(lesson.id, Math.round(accuracy * 100));
          // Reward: completing a lesson with 80%+ accuracy earns a streak freeze
          if (accuracy >= 0.8) {
            DataManager.addStreakFreeze(1);
          }
        }

        if (this.reviewMode) {
          // Spaced repetition intervals are updated during exercise rendering
          // (via recordCorrectAnswer/recordWrongAnswer), so no double-processing here.
          // Just mark review complete.
        }

        // Update streak
        DataManager.updateStreak();

        // Track daily XP for goal progress
        if (totalXP > 0) {
          DataManager.addDailyXP(totalXP);
        }

        // Go to completion screen
        this.completionData = {
          lessonId: lesson.id,
          lessonTitle: lesson.title,
          xpEarned: totalXP,
          accuracy: Math.round(accuracy * 100),
          correct,
          total
        };

        this.currentScreen = 'completion';
        this.render();
      },

      renderCompletion() {
        const data = this.completionData;
        const div = document.createElement('div');
        div.className = 'completion-screen';

        div.innerHTML = `
          <div class="completion-icon">🎉</div>
          <div class="completion-title">Lesson Complete!</div>
          <div class="completion-subtitle">${data.lessonTitle}</div>
          <div class="xp-gain">+${data.xpEarned} XP</div>
          <p style="margin-bottom: 8px; color: var(--text-secondary);">
            Accuracy: ${data.accuracy}% (${data.correct}/${data.total} correct)
          </p>
          <div class="sources-note">
            ${data.accuracy === 100 ? 'Perfect! All answers correct.' :
              data.accuracy >= 80 ? 'Great job! Review the mistakes to improve.' :
              'Keep practicing! Try reviewing this lesson again.'}
          </div>
        `;

        const btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.textContent = 'Back to Skills';
        btn.style.marginTop = '20px';
        btn.addEventListener('click', () => {
          this.currentScreen = 'home';
          this.render();
        });
        div.appendChild(btn);

        if (data.accuracy < 100 && !this.reviewMode) {
          const reviewBtn = document.createElement('button');
          reviewBtn.className = 'btn btn-secondary';
          reviewBtn.textContent = 'Review Mistakes';
          reviewBtn.style.marginTop = '12px';
          reviewBtn.style.marginLeft = '12px';
          reviewBtn.addEventListener('click', () => {
            // Review this session's mistakes directly, not the scheduled
            // due-queue (those items have nextReviewAt = now + 1 day and
            // won't show up via getWrongAnswersForReview()).
            const sessionMistakes = this.exerciseResults
              .filter(r => !r.correct)
              .map(r => r.exercise);
            this.startReviewWith(sessionMistakes.map(ex => ({
              type: ex.type, prompt: ex.prompt, answer: ex.answer,
              exerciseId: ex.id,
              choices: ex.choices, pairs: ex.pairs, words: ex.words,
              explanation: ex.explanation, note: ex.note, sources: ex.sources
            })));
            this.render();
          });
          div.appendChild(reviewBtn);
        }

        if (!this.reviewMode) {
          const practiceBtn = document.createElement('button');
          practiceBtn.className = 'btn btn-secondary';
          practiceBtn.textContent = 'Practice Again';
          practiceBtn.style.marginTop = '12px';
          practiceBtn.style.marginLeft = '12px';
          practiceBtn.addEventListener('click', () => {
            this.startLesson(this.completionData.lessonId);
            this.render();
          });
          div.appendChild(practiceBtn);
        }

        return div;
      },

      renderReview() {
        const due = DataManager.getWrongAnswersForReview();
        if (due.length === 0) {
          const div = document.createElement('div');
          div.className = 'lesson-screen';
          div.innerHTML = `
            <div style="text-align: center; padding: 60px 20px;">
              <div style="font-size: 3rem; margin-bottom: 20px;">✅</div>
              <h2>No Reviews Due</h2>
              <p style="color: var(--text-secondary); margin-bottom: 24px;">
                You have no items scheduled for review today. Keep practicing to build your review queue!
              </p>
              <button class="btn btn-primary" onclick="App.currentScreen='home';App.render();">
                Back to Skills
              </button>
            </div>
          `;
          return div;
        }

        this.startReviewWith(due);
        return this.renderLesson();
      },

      renderPronunciation() {
        const div = document.createElement('div');
        div.className = 'home-screen';

        const title = document.createElement('h2');
        title.textContent = 'Pronunciation Guide';
        title.style.marginBottom = '8px';
        div.appendChild(title);

        const subtitle = document.createElement('p');
        subtitle.textContent = 'How to speak Fijian sounds';
        subtitle.style.color = 'var(--text-secondary)';
        subtitle.style.marginBottom = '20px';
        div.appendChild(subtitle);

        // Vowels table
        const vowelTitle = document.createElement('h3');
        vowelTitle.textContent = 'Vowels';
        vowelTitle.style.marginBottom = '8px';
        vowelTitle.style.color = 'var(--primary)';
        div.appendChild(vowelTitle);

        const vowelTable = document.createElement('table');
        vowelTable.className = 'pronounce-table';
        vowelTable.innerHTML = '<tr><th>Letter</th><th>Sound</th><th>Example</th></tr>';
        PRONUNCIATION.vowels.forEach(v => {
          const row = document.createElement('tr');
          row.innerHTML = `<td><strong>${v.char}</strong></td><td class="sound-cell">/${v.sound}/</td><td>${v.example}</td>`;
          vowelTable.appendChild(row);
        });
        div.appendChild(vowelTable);

        // Consonants table
        const consonantTitle = document.createElement('h3');
        consonantTitle.textContent = 'Tricky Consonants';
        consonantTitle.style.marginTop = '24px';
        consonantTitle.style.marginBottom = '8px';
        consonantTitle.style.color = 'var(--primary)';
        div.appendChild(consonantTitle);

        const consonantTable = document.createElement('table');
        consonantTable.className = 'pronounce-table';
        consonantTable.innerHTML = '<tr><th>Letter</th><th>Sound</th><th>Example</th></tr>';
        PRONUNCIATION.consonants.forEach(c => {
          const row = document.createElement('tr');
          row.innerHTML = `<td><strong>${c.char}</strong></td><td class="sound-cell">/${c.sound}/</td><td>${c.example}</td>`;
          consonantTable.appendChild(row);
        });
        div.appendChild(consonantTable);

        // Tips
        const tipsTitle = document.createElement('h3');
        tipsTitle.textContent = 'Pronunciation Tips';
        tipsTitle.style.marginTop = '24px';
        tipsTitle.style.marginBottom = '8px';
        tipsTitle.style.color = 'var(--primary)';
        div.appendChild(tipsTitle);

        const tipsList = document.createElement('ul');
        tipsList.className = 'pronounce-tips';
        PRONUNCIATION.tips.forEach(tip => {
          const li = document.createElement('li');
          li.textContent = tip;
          tipsList.appendChild(li);
        });
        div.appendChild(tipsList);

        // Back button
        const backBtn = document.createElement('button');
        backBtn.className = 'btn btn-secondary';
        backBtn.textContent = '← Back to Skills';
        backBtn.style.marginTop = '20px';
        backBtn.onclick = () => { App.currentScreen = 'home'; App.render(); };
        div.appendChild(backBtn);

        return div;
      },

      renderSources() {
        const div = document.createElement('div');
        div.className = 'home-screen';

        const title = document.createElement('h2');
        title.textContent = 'Language Sources';
        title.style.marginBottom = '8px';
        div.appendChild(title);

        const subtitle = document.createElement('p');
        subtitle.textContent = 'All vocabulary verified from these authoritative sources:';
        subtitle.style.color = 'var(--text-secondary)';
        subtitle.style.marginBottom = '20px';
        div.appendChild(subtitle);

        const list = document.createElement('ul');
        list.className = 'sources-list';
        for (const [key, desc] of Object.entries(SOURCES)) {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${key}</strong> — ${desc}`;
          list.appendChild(li);
        }
        div.appendChild(list);

        const disclaimer = document.createElement('p');
        disclaimer.style.marginTop = '20px';
        disclaimer.style.fontSize = '0.85rem';
        disclaimer.style.color = 'var(--text-secondary)';
        disclaimer.innerHTML = '<strong>Note:</strong> All vocabulary is verified from at least two independent sources where possible. Words that could not be cross-verified are flagged in the sources section.<br><strong>Color discrepancy:</strong> PolyglotClub [4] lists different color words that conflict with cross-verified sources [7,12]. We use the cross-verified set (vulavula=white, loaloa=black, etc.) based on Glosbe confirming drau=leaf, not white.';
        div.appendChild(disclaimer);

        // Back button
        const backBtn = document.createElement('button');
        backBtn.className = 'btn btn-secondary';
        backBtn.textContent = '← Back to Skills';
        backBtn.style.marginTop = '20px';
        backBtn.onclick = () => { App.currentScreen = 'home'; App.render(); };
        div.appendChild(backBtn);

        return div;
      }
    };

    // Exposed on window for the same reason as DataManager above — lets
    // test.html drive App's methods against the real running app.
    window.App = App;

    // ─── Event Listeners ─────────────────────────────────────────
    const homeLogo = document.getElementById('home-logo');
    const goHome = () => { App.currentScreen = 'home'; App.render(); };
    homeLogo.addEventListener('click', goHome);
    homeLogo.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        goHome();
      }
    });

    document.getElementById('review-btn').addEventListener('click', () => {
      if (DataManager.getWrongAnswersForReview().length > 0) {
        App.currentScreen = 'review';
        App.render();
      }
    });

    document.getElementById('sync-btn').addEventListener('click', () => {
      if (window.FirebaseSync && FirebaseSync.isSignedIn()) {
        // If signed in, show sign-out option
        if (confirm('Signed in as ' + FirebaseSync.currentUser.email + '\n\nClick OK to sign out, or Cancel to cancel.')) {
          FirebaseSync.signOut();
        }
      } else {
        App.currentScreen = 'auth';
        App.render();
      }
    });

    document.getElementById('settings-btn').addEventListener('click', () => {
      App.currentScreen = 'settings';
      App.render();
    });

    // ─── Auth Screen Renderer ───────────────────────────────────
    const AuthScreen = {
      render: () => {
        const div = document.createElement('div');
        div.className = 'auth-screen';

        const card = document.createElement('div');
        card.className = 'auth-card';

        const title = document.createElement('h2');
        title.textContent = '☁️ Sync Progress';

        const desc = document.createElement('p');
        desc.textContent = 'Sign in to sync your progress across devices. Your data is stored securely and only you can access it. The app works offline without an account — sign in only if you want cloud sync.';

        card.appendChild(title);
        card.appendChild(desc);

        // Email form
        const form = document.createElement('div');
        form.className = 'auth-form';

        const emailInput = document.createElement('input');
        emailInput.type = 'email';
        emailInput.placeholder = 'you@example.com';
        emailInput.id = 'auth-email';

        const passwordInput = document.createElement('input');
        passwordInput.type = 'password';
        passwordInput.placeholder = 'Password';
        passwordInput.id = 'auth-password';

        const signInBtn = document.createElement('button');
        signInBtn.className = 'auth-btn email-btn';
        signInBtn.textContent = 'Sign In';
        signInBtn.onclick = async () => {
          const email = emailInput.value;
          const password = passwordInput.value;
          const errorEl = document.getElementById('auth-error');
          try {
            await FirebaseSync.signInWithEmail(email, password);
          } catch(e) {
            errorEl.textContent = e.message;
            errorEl.style.display = 'block';
          }
        };

        const signUpBtn = document.createElement('button');
        signUpBtn.className = 'auth-btn email-btn';
        signUpBtn.textContent = 'Sign Up';
        signUpBtn.onclick = async () => {
          const email = emailInput.value;
          const password = passwordInput.value;
          const errorEl = document.getElementById('auth-error');
          if (password.length < 6) {
            errorEl.textContent = 'Password must be at least 6 characters';
            errorEl.style.display = 'block';
            return;
          }
          try {
            await FirebaseSync.signUpWithEmail(email, password);
          } catch(e) {
            errorEl.textContent = e.message;
            errorEl.style.display = 'block';
          }
        };

        const divider = document.createElement('div');
        divider.textContent = '— or —';
        divider.style.textAlign = 'center';
        divider.style.color = 'var(--text-secondary)';
        divider.style.fontSize = '0.85rem';

        const googleBtn = document.createElement('button');
        googleBtn.className = 'auth-btn google-btn';
        googleBtn.innerHTML = 'Sign in with Google';
        googleBtn.onclick = async () => {
          const errorEl = document.getElementById('auth-error');
          try {
            await FirebaseSync.signInWithGoogle();
          } catch(e) {
            errorEl.textContent = e.message;
            errorEl.style.display = 'block';
          }
        };

        const errorEl = document.createElement('div');
        errorEl.id = 'auth-error';
        errorEl.className = 'auth-error';
        errorEl.style.display = 'none';

        form.appendChild(emailInput);
        form.appendChild(passwordInput);
        form.appendChild(signInBtn);
        form.appendChild(signUpBtn);
        form.appendChild(divider);
        form.appendChild(googleBtn);
        form.appendChild(errorEl);

        const skipBtn = document.createElement('button');
        skipBtn.className = 'auth-btn skip-btn';
        skipBtn.textContent = 'Continue without an account';
        skipBtn.onclick = () => {
          App.currentScreen = 'home';
          App.render();
        };

        card.appendChild(form);
        card.appendChild(skipBtn);
        div.appendChild(card);

        return div;
      }
    };

    window.AuthScreen = AuthScreen;

    // ─── Initialize ─────────────────────────────────────────────
    FirebaseSync.init();
    App.init();

    // ─── PWA Service Worker Registration ─────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
